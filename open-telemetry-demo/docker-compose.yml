services:
  azure-sql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${AZURE_SQL_SA_PASSWORD:-CityWeatherDemo123!}
    ports:
      - "1433:1433"
    networks:
      - app-network

  account-service:
    build:
      context: .
      dockerfile: services/AccountService/Dockerfile
      additional_contexts:
        graftcode_logger: ../../graftcode-logger/src/netcore/GraftCodeNetcoreLogger
    ports:
      - "8082:80"
      - "8991:8989"
    environment:
      AZURE_SQL_CONNECTION_STRING: Server=azure-sql,1433;Database=master;User Id=sa;Password=${AZURE_SQL_SA_PASSWORD:-CityWeatherDemo123!};TrustServerCertificate=True;Encrypt=False
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      WEBSITE_SITE_NAME: GraftCodeOpenTelemetryDemoAccountServiceNetcore
    depends_on:
      azure-sql:
        condition: service_started
    networks:
      - app-network

  temperature-conversion-service:
    build:
      context: .
      dockerfile: services/TemperatureConversionService/Dockerfile
      additional_contexts:
        graftcode_logger: ../../graftcode-logger/src/netcore/GraftCodeNetcoreLogger
    environment:
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      WEBSITE_SITE_NAME: GraftCodeOpenTelemetryDemoTemperatureConversionServiceNetcore
      SERVICE_BUS_CONNECTION_STRING: ${SERVICE_BUS_CONNECTION_STRING:-}
      SERVICE_BUS_QUEUE: ${SERVICE_BUS_QUEUE:-}
      SERVICE_BUS_REPLY_QUEUE: ${SERVICE_BUS_REPLY_QUEUE:-}
      SERVICE_BUS_RPC_TIMEOUT_MS: ${SERVICE_BUS_RPC_TIMEOUT_MS:-30000}
    networks:
      - app-network

  user-service:
    build:
      context: .
      dockerfile: services/UserService/Dockerfile
      additional_contexts:
        graftcode_logger: ../../graftcode-logger/src/netcore/GraftCodeNetcoreLogger
    ports:
      - "8080:80"
      - "8989:8989"
    environment:
      ACCOUNT_SERVICE_GRAFT_HOST: ws://account-service/ws
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      WEBSITE_SITE_NAME: GraftCodeOpenTelemetryDemoUserServiceNetcore
    depends_on:
      - account-service
    networks:
      - app-network

  city-weather-service:
    build:
      context: .
      dockerfile: services/CityWeatherService/Dockerfile
      additional_contexts:
        graftcode_logger: ../../graftcode-logger/src/netcore/GraftCodeNetcoreLogger
    ports:
      - "8081:80"
      - "8990:8989"
    environment:
      ACCOUNT_SERVICE_GRAFT_HOST: ws://account-service/ws
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
      WEBSITE_SITE_NAME: GraftCodeOpenTelemetryDemoCityWeatherServiceNetcore
      SERVICE_BUS_CONNECTION_STRING: ${SERVICE_BUS_CONNECTION_STRING:-}
      SERVICE_BUS_QUEUE: ${SERVICE_BUS_QUEUE:-}
      SERVICE_BUS_REPLY_QUEUE: ${SERVICE_BUS_REPLY_QUEUE:-}
      SERVICE_BUS_RPC_TIMEOUT_MS: ${SERVICE_BUS_RPC_TIMEOUT_MS:-30000}
    depends_on:
      - account-service
      - temperature-conversion-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
